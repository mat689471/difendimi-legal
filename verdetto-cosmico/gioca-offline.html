<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#080a14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23080a14'/%3E%3Ccircle cx='14' cy='13' r='6' fill='%233a7bd8'/%3E%3Cellipse cx='14' cy='13' rx='9' ry='2.8' fill='none' stroke='%234bd8ff' stroke-width='1.4'/%3E%3Ccircle cx='19' cy='20' r='5' fill='none' stroke='%234bd8ff' stroke-width='2'/%3E%3Cline x1='23' y1='24' x2='27' y2='28' stroke='%234bd8ff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Verdetto Cosmico</title>
<style>
  :root{
    --bg:#080a14; --panel:#121627; --panel2:#0d1120; --ink:#eaf0ff; --muted:#9aa6c8;
    --line:rgba(120,200,255,.22); --cyan:#4bd8ff;
    --A:#3ddc84; --B:#4aa8ff; --C:#b98cff; --D:#ff5d6c;
    --radius:16px; --fs:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:var(--fs); line-height:1.45; overflow:hidden;
    -webkit-user-select:none; user-select:none;
  }
  body.big{--fs:18px}
  #stars{position:fixed;inset:0;z-index:0;display:block}
  #neb{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(60% 45% at 25% 20%, rgba(90,60,180,.28), transparent 70%),
      radial-gradient(55% 40% at 80% 75%, rgba(30,120,180,.22), transparent 70%),
      radial-gradient(120% 90% at 50% 120%, rgba(10,14,30,.9), transparent 60%);
  }
  #bgimg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;opacity:.30;pointer-events:none}
  #app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;
    max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
  .screen{flex:1;display:none;flex-direction:column;min-height:0;padding:14px 0 18px}
  .screen.on{display:flex;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0}

  h1,h2,h3{margin:0;font-weight:800;letter-spacing:.5px}
  .brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;margin-top:6vh}
  .emblem{width:118px;height:118px;object-fit:contain;filter:drop-shadow(0 0 22px rgba(75,216,255,.35))}
  .title{font-size:2.05rem;background:linear-gradient(90deg,#7fe9ff,#b98cff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .tagline{color:var(--muted);font-size:.98rem;max-width:22em}
  .stampline{font:600 .72rem/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px;color:#6f7ba6;
    border:1px solid var(--line);border-radius:999px;padding:6px 12px;margin-top:2px}

  .btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);
    font-size:1rem;font-weight:700;padding:15px 16px;border-radius:14px;cursor:pointer;width:100%;
    display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .06s,border-color .15s,background .15s}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:linear-gradient(180deg,#18325a,#122043);border-color:rgba(75,216,255,.55);
    box-shadow:0 0 0 1px rgba(75,216,255,.15) inset,0 8px 26px rgba(20,40,90,.5)}
  .btn.ghost{background:transparent}
  .btn.sm{padding:11px 12px;font-size:.92rem}
  .menu{display:flex;flex-direction:column;gap:11px;margin-top:26px}
  .row{display:flex;gap:11px}
  .row>*{flex:1}

  .statbar{display:flex;gap:10px;margin-top:20px}
  .stat{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:11px 8px;text-align:center}
  .stat b{display:block;font-size:1.12rem}
  .stat span{font-size:.68rem;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}

  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .iconbtn{width:40px;height:40px;flex:0 0 40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);
    color:var(--ink);font-size:1.1rem;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .hbadge{font:700 .8rem/1 ui-monospace,monospace;color:var(--muted)}
  .hstat{display:flex;gap:14px;align-items:center}
  .hstat .lives{letter-spacing:2px;font-size:1.05rem}
  .hstat .sc{font-weight:800}

  .prog{height:5px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:12px}
  .prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),#b98cff);width:0;transition:width .3s}

  /* card */
  .card{background:linear-gradient(180deg,rgba(22,27,46,.96),rgba(13,17,32,.96));
    border:1px solid var(--line);border-radius:18px;padding:16px 15px;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;inset:0;background:
    repeating-linear-gradient(180deg,transparent 0 22px,rgba(255,255,255,.012) 22px 23px);pointer-events:none}
  .catrow{display:flex;align-items:center;gap:9px;color:var(--cyan);font-size:.82rem;font-weight:700;letter-spacing:.4px}
  .catrow svg{width:22px;height:22px;flex:0 0 22px}
  .casetag{margin-left:auto;font:600 .68rem/1 ui-monospace,monospace;letter-spacing:2px;color:#6f7ba6;
    border:1px solid var(--line);border-radius:6px;padding:5px 7px}
  .ctitle{font-size:1.18rem;font-weight:800;margin:12px 0 8px}
  .claim{font-size:1.02rem;color:#dfe6ff}
  .qlabel{margin:16px 2px 10px;color:var(--muted);font-size:.9rem;text-align:center}

  .verdicts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .vbtn{border:1.5px solid var(--vc);background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.14));
    color:var(--ink);border-radius:14px;padding:13px 10px;cursor:pointer;text-align:left;transition:transform .06s,box-shadow .15s;position:relative}
  .vbtn:active{transform:scale(.98)}
  .vbtn .k{display:inline-flex;width:26px;height:26px;border-radius:8px;align-items:center;justify-content:center;
    font-weight:800;color:#06111f;background:var(--vc);font-size:.95rem;margin-bottom:7px}
  .vbtn .lb{display:block;font-weight:800;font-size:.98rem;color:var(--vc)}
  .vbtn .sub{display:block;font-size:.76rem;color:var(--muted);margin-top:3px;line-height:1.3}
  .vbtn[disabled]{opacity:.5;cursor:default}
  .vbtn.pick{box-shadow:0 0 0 2px var(--vc) inset}
  .vbtn.rightone{box-shadow:0 0 0 2px var(--A) inset;border-color:var(--A)}
  .vbtn.wrongone{box-shadow:0 0 0 2px var(--D) inset;border-color:var(--D)}

  /* feedback */
  .fb{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:14px;animation:fade .2s}
  .fbhead{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem}
  .fbdot{width:12px;height:12px;border-radius:50%}
  .fbpts{margin-left:auto;font-weight:800}
  .fbverdict{margin:10px 0 6px;font-size:.92rem;color:var(--muted)}
  .fbverdict b{color:var(--ink)}
  .fbwhy{font-size:.96rem;color:#dfe6ff}
  .fbsrc{margin-top:10px;font-size:.72rem;color:#6f7ba6}

  .legend{display:flex;flex-direction:column;gap:9px;margin-top:14px}
  .leg{display:flex;gap:11px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px}
  .leg .k{flex:0 0 28px;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#06111f}
  .leg b{font-size:.95rem}
  .leg p{margin:2px 0 0;font-size:.85rem;color:var(--muted)}

  .chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:6px}
  .chip{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 10px;cursor:pointer;
    display:flex;align-items:center;gap:9px;flex:1 1 46%;font-size:.92rem;font-weight:600}
  .chip svg{width:20px;height:20px}
  .chip:active{transform:scale(.98)}

  .big-emb{width:96px;height:96px;object-fit:contain;margin:2px auto 4px;display:block;filter:drop-shadow(0 0 18px rgba(75,216,255,.3))}
  .result-score{font-size:3rem;font-weight:800;text-align:center;background:linear-gradient(90deg,#7fe9ff,#b98cff);
    -webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
  .center{text-align:center}
  .muted{color:var(--muted)}
  .sec{margin-top:16px}
  .sec h3{font-size:.78rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
  p.lead{color:#dfe6ff;margin:.4em 0}
  .pack{opacity:.7;border-style:dashed}
  .pack .lock{margin-left:auto;font-size:.7rem;border:1px solid var(--line);border-radius:99px;padding:3px 9px;color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:#182142;border:1px solid var(--line);color:var(--ink);padding:11px 16px;border-radius:12px;
    font-size:.9rem;z-index:50;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:88%}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
  .switch{display:flex;align-items:center;justify-content:space-between;background:var(--panel2);
    border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px}
  .tg{width:48px;height:28px;border-radius:99px;background:#2a3153;position:relative;cursor:pointer;flex:0 0 48px;transition:background .15s}
  .tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
  .tg.on{background:var(--cyan)}
  .tg.on::after{left:23px}
  .space{flex:1}
  .foot{display:flex;gap:11px;margin-top:14px}
  .foot>*{flex:1}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="neb"></div>
<div id="bgimg"></div>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script type="module">
/* ===== strings.js ===== */
// strings.js — tutti i testi visibili nell'interfaccia.
// Cambiare lingua = tradurre questo file, senza toccare il codice.
const STR = {
  title: "VERDETTO COSMICO",
  tagline: "Sei tu il revisore scientifico. Prova, indizio o bufala?",
  loading: "Inizializzazione archivio…",

  // menu
  play: "Nuova indagine",
  daily: "Sfida del giorno",
  howto: "Come si gioca",
  support: "Sostieni il gioco",
  stats: "Statistiche",
  settings: "Opzioni",
  rankLabel: "Grado",
  bestLabel: "Record",
  accuracyLabel: "Precisione",

  // selezione capitolo
  chooseChapter: "Scegli il fascicolo",
  allChapters: "Tutti i casi",
  startRun: "Avvia",
  back: "Indietro",

  // gioco
  livesLabel: "Vite",
  scoreLabel: "Punti",
  streakLabel: "Serie",
  caseLabel: "CASO",
  question: "Che livello di prova merita?",
  next: "Prossimo caso",
  correct: "Verdetto corretto!",
  wrong: "Verdetto sbagliato",
  correctAnswerWas: "La classificazione corretta è",
  plus: "+",
  streakBonus: "serie ×",
  sourceNote: "Fonte: Dossier «Vita nell'universo» — chiusura 5 luglio 2026.",

  // fine partita
  gameOver: "Indagine conclusa",
  finalScore: "Punteggio finale",
  casesJudged: "Casi giudicati",
  newBest: "Nuovo record!",
  rankUp: "Promozione di grado!",
  playAgain: "Jouer encore", // placeholder che NON deve apparire: sovrascritto sotto
  retry: "Rigioca",
  toMenu: "Menu",
  share: "Condividi risultato",
  shareCopied: "Risultato copiato negli appunti!",
  shareText: (score, total, rank) =>
    `Ho totalizzato ${score} punti in Verdetto Cosmico giudicando ${total} casi reali su vita, Marte, UFO ed esopianeti. Grado: ${rank}. Riesci a fare meglio?`,

  // sfida quotidiana
  dailyTitle: "Sfida del giorno",
  dailyDesc: "10 casi, un solo tentativo al giorno. Stesse carte per tutti.",
  dailyDone: "Hai già completato la sfida di oggi.",
  dailyResult: "Risultato di oggi",
  dailyComeBack: "Torna domani per una nuova sfida.",
  startDaily: "Comincia",

  // come si gioca
  howtoTitle: "Come si gioca",
  howtoBody: [
    "Ti mostriamo un caso reale tratto da un dossier scientifico: una missione, un reperto, un segnale, un avvistamento.",
    "Il tuo compito: assegnargli il giusto livello di prova, come farebbe un revisore scientifico.",
    "Ogni risposta corretta vale punti; una serie di risposte giuste moltiplica il punteggio. Hai 3 vite.",
    "Dopo ogni verdetto scopri la spiegazione: è così che si impara a distinguere una prova da una suggestione.",
  ],
  legendTitle: "I quattro livelli di prova",

  // opzioni
  soundOn: "Suoni",
  bigText: "Testo grande",
  reset: "Azzera progressi",
  resetConfirm: "Cancellare punteggi e statistiche? Non si può annullare.",

  // sostieni / monetizzazione
  supportTitle: "Sostieni Verdetto Cosmico",
  supportBody: "Questo gioco è gratuito. Se ti diverte e vuoi vederlo crescere con nuovi fascicoli, puoi dare una mano:",
  supportDonate: "☕ Offri un caffè allo sviluppatore",
  supportShare: "📣 Condividi con un amico curioso",
  supportRate: "⭐ Lascia una recensione",
  packsTitle: "Fascicoli extra (in arrivo)",
  packsBody: "Nuove raccolte di casi: «Grandi bufale», «Missioni spaziali», «Misteri archeologici». Presto disponibili.",
  packLocked: "In arrivo",

  // gradi (rank) — dal più basso al più alto
  ranks: [
    "Curioso",
    "Appassionato",
    "Osservatore",
    "Analista junior",
    "Ricercatore",
    "Revisore scientifico",
    "Astrobiologo",
    "Direttore di ricerca",
  ],
};

// correzione del placeholder lasciato apposta
STR.playAgain = "Rigioca";

/* ===== data.js ===== */
// data.js — tutti i casi del gioco, estratti dal dossier "Vita nell'universo".
// Contenuto esterno al codice: aggiungere un caso = aggiungere una riga qui.
//
// Livelli di prova (regola d'oro del dossier):
//   A = PROVATO        (osservazione ripetuta, strumenti calibrati, consenso)
//   B = INDIZIO        (dato reale e interessante, ma non conclusivo)
//   C = IPOTESI        (proposta testabile che guida esperimenti, non una scoperta)
//   D = NON VERIFICATO (mancano dati controllabili o replicabili)
const LEVELS = {
  A: { key: "A", label: "PROVATO",        short: "Provato",        color: "#3ddc84", desc: "Osservato e ripetuto, con consenso scientifico." },
  B: { key: "B", label: "INDIZIO",        short: "Indizio",        color: "#4aa8ff", desc: "Dato reale ma non conclusivo: restano spiegazioni alternative." },
  C: { key: "C", label: "IPOTESI",        short: "Ipotesi",        color: "#b98cff", desc: "Idea testabile che guida la ricerca, non ancora una scoperta." },
  D: { key: "D", label: "NON VERIFICATO", short: "Non verif.",     color: "#ff5d6c", desc: "Mancano dati controllabili: affermazione non dimostrata." },
};
const CATEGORIES = {
  origine:    { name: "Origine della vita", glyph: "origine" },
  marte:      { name: "Marte",              glyph: "marte" },
  lune:       { name: "Lune oceaniche",     glyph: "lune" },
  esopianeti: { name: "Esopianeti",         glyph: "esopianeti" },
  seti:       { name: "SETI e segnali",     glyph: "seti" },
  uap:        { name: "UAP / UFO",          glyph: "uap" },
  archivi:    { name: "Archivi antichi",    glyph: "archivi" },
  cosmo:      { name: "Cosmo",              glyph: "cosmo" },
};

// answer = livello corretto secondo il dossier.
const CASES = [
  // ————— ORIGINE DELLA VITA —————
  { id: 1, cat: "origine", title: "Esperimento di Miller-Urey (1953)",
    claim: "Facendo passare scariche elettriche in una miscela di acqua, metano, ammoniaca e idrogeno si formano amminoacidi, i mattoni delle proteine.",
    answer: "A",
    why: "Chimica reale e ripetibile: alcune molecole biologiche nascono senza organismi, in condizioni energetiche plausibili. Ma NON crea una cellula, un genoma o la vita: dimostra la plausibilità di alcuni passaggi, non l'origine della vita." },
  { id: 2, cat: "origine", title: "Il mondo a RNA",
    claim: "Prima del DNA e delle proteine, molecole simili all'RNA portavano l'informazione e catalizzavano le reazioni della prima vita.",
    answer: "C",
    why: "Filone di ricerca serio e influente, ma la sintesi credibile dei nucleotidi, la loro polimerizzazione e il passaggio a DNA/proteine restano problemi aperti. È un'ipotesi di lavoro che guida gli esperimenti." },
  { id: 3, cat: "origine", title: "Esperimento di Redi (1668)",
    claim: "In condizioni controllate gli insetti non compaiono spontaneamente dalla carne: servono uova deposte da altri insetti.",
    answer: "A",
    why: "Esperimento controllato e ripetibile, pietra miliare del metodo scientifico. Ha smontato la 'generazione spontanea' come spiegazione della vita." },
  { id: 4, cat: "origine", title: "Pasteur, i palloni a collo di cigno (1861)",
    claim: "L'aria non genera automaticamente vita: i microrganismi in un brodo sterile arrivano da contaminanti esterni.",
    answer: "A",
    why: "Risultato osservato e ripetuto. Attenzione: la biogenesi non esclude un'abiogenesi antica in condizioni diversissime; cambia il problema, non lo chiude." },
  { id: 5, cat: "origine", title: "Panspermia",
    claim: "La vita, o i suoi precursori, è arrivata sulla Terra viaggiando nello spazio su rocce o granelli di polvere.",
    answer: "C",
    why: "Ipotesi in parte testabile ma non confermata. Anche se fosse vera, sposterebbe solo il luogo di origine: non spiega come la vita sia nata la prima volta." },
  { id: 6, cat: "origine", title: "Stromatoliti di Dresser (3,48 miliardi di anni)",
    claim: "Le strutture sedimentarie della Dresser Formation (Australia) sono resti di antiche comunità microbiche.",
    answer: "B",
    why: "Più linee di evidenza sono compatibili con attività microbica: è un indizio forte. Ma le rocce antichissime possono produrre strutture simili senza vita, quindi va sempre valutato contro imitazioni abiologiche." },
  { id: 7, cat: "origine", title: "Microstrutture dell'Apex chert",
    claim: "Le microstrutture dell'Apex chert (3,5 miliardi di anni) sono i più antichi microfossili conosciuti della Terra.",
    answer: "D",
    why: "Pubblicate come microfossili, ma analisi successive con tecniche migliori hanno contestato l'interpretazione biologica. È il caso-scuola su come cambiano le conclusioni: la lettura come vita non regge." },
  { id: 8, cat: "origine", title: "Carbonio negli zirconi (4,1 miliardi di anni)",
    claim: "Il carbonio intrappolato in cristalli di zircone di 4,1 miliardi di anni è la firma della vita più antica mai trovata.",
    answer: "D",
    why: "Alcuni studi hanno proposto segnali potenzialmente biogenici, ma il significato è molto controverso e non conclusivo: mancano prove controllabili che escludano origini non biologiche." },
  { id: 44, cat: "origine", title: "Origine nelle sorgenti idrotermali",
    claim: "La vita è iniziata nelle sorgenti idrotermali oceaniche, dove minerali e gradienti chimici hanno alimentato le prime reazioni.",
    answer: "C",
    why: "È uno dei principali scenari di ricerca ('metabolism-first'), con esperimenti in corso. Manca però il passaggio dimostrato da cicli chimici a ereditarietà e membrane: resta un'ipotesi di lavoro." },

  // ————— MARTE —————
  { id: 9, cat: "marte", title: "Viking, esperimento Labeled Release (1976)",
    claim: "Il Labeled Release del Viking rilevò gas dopo l'aggiunta di nutrienti al suolo marziano: è la firma di un metabolismo microbico.",
    answer: "B",
    why: "Il segnale è reale e si ripeté ai due siti, ma anche reazioni chimiche del suolo possono produrne di simili, e il GC/MS non trovò organici attesi. Risultato corretto: ambiguità persistente, non vita provata né esclusa." },
  { id: 10, cat: "marte", title: "Meteorite ALH84001 (1996)",
    claim: "Il meteorite marziano ALH84001 contiene microstrutture, carbonati e magnetite che sono fossili di antica vita su Marte.",
    answer: "B",
    why: "Meteorite reale, studiato per decenni. Ma ogni singola linea di prova ha ricevuto spiegazioni abiologiche o problemi di contaminazione: nessun consenso di vita marziana. Caso non conclusivo." },
  { id: 11, cat: "marte", title: "Perseverance, campione 'Sapphire Canyon' (2024-25)",
    claim: "Il campione Sapphire Canyon, raccolto da Perseverance a Cheyava Falls, contiene biosignature potenziali di vita marziana.",
    answer: "B",
    why: "La NASA parla esplicitamente di biosignature POTENZIALI: indica che serve altro studio, non un annuncio di vita. Restano possibili spiegazioni geochimiche. Indizio da confermare." },
  { id: 12, cat: "marte", title: "I 'canali' di Marte",
    claim: "I canali osservati da Schiaparelli e interpretati da Lowell sono opere di ingegneria di una civiltà marziana.",
    answer: "D",

/* seeded RNG per sfida quotidiana (mulberry32) */
function rng(seed){let a=seed>>>0;return ()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,rand=Math.random){const a=arr.slice();for(let i=a.length-1;i>0;i--){
  const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function todaySeed(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}

/* ───────── audio (WebAudio, opzionale) ───────── */
let actx=null;
function beep(freq,dur=.09,type="sine",gain=.05){
  if(!settings.sound) return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type;o.frequency.value=freq;o.connect(g);g.connect(actx.destination);
    g.gain.setValueAtTime(gain,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+dur);
    o.start();o.stop(actx.currentTime+dur);}catch{}
}

  s.appendChild($(`<div class="sec"><h3>${STR.allChapters==""?"":"Fascicoli"}</h3></div>`));
  s.appendChild(chips);
  n.querySelector("#all").onclick=()=>{sfx.click();newRun();};
  setScreen(n);
}
function startFiltered(cat){
  G_={deck:shuffle(CASES.filter(x=>x.cat===cat)),i:0,score:0,lives:3,streak:0,answered:0,correct:0,daily:false,answeredThis:false};
  screenGame();
}

function screenDaily(){
  const isToday=daily.date===todaySeed()&&daily.done;
  const n=$(`<div class="screen on"><div class="scroll"></div></div>`);
  const s=n.querySelector(".scroll");
  s.appendChild(header(STR.dailyTitle));
  s.appendChild($(`<div class="card"><div class="ctitle">📅 ${STR.dailyTitle}</div>
    <p class="claim">${STR.dailyDesc}</p></div>`));
  if(isToday){
    s.appendChild($(`<div class="fb"><div class="fbhead">${STR.dailyResult}
      <span class="fbpts">${daily.score} pt</span></div>
      <div class="fbwhy">${STR.dailyComeBack}</div></div>`));
  }else{
    const b=$(`<button class="btn primary sec" id="go">▶️ ${STR.startDaily}</button>`);
    b.onclick=()=>{sfx.click();newRun({daily:true});};
    s.appendChild(b);
  }
  setScreen(n);
}

function screenGame(){
  const g=G_;
  const c=g.deck[g.i];
  const pct=Math.round(g.i/g.deck.length*100);
  const hearts="●".repeat(g.lives)+"○".repeat(3-g.lives);
  const n=$(`<div class="screen on">
    <div class="top">
      <button class="iconbtn" id="quit">✕</button>
      <div class="hstat">
        <span class="lives" style="color:var(--D)" title="${STR.livesLabel}">${hearts}</span>
        ${g.streak>=2?`<span class="hbadge" style="color:var(--cyan)">🔥×${multiplier(g.streak)}</span>`:``}
        <span class="sc">${g.score}</span>
      </div>
    </div>
    <div class="prog"><i style="width:${pct}%"></i></div>
    <div class="scroll">
      <div class="card">
        <div class="catrow">${glyph(c.cat)}<span>${CATEGORIES[c.cat].name}</span>
          <span class="casetag">${STR.caseLabel} ${String(g.i+1).padStart(2,"0")}/${String(g.deck.length).padStart(2,"0")}</span></div>
        <div class="ctitle">${c.title}</div>
        <div class="claim">«${c.claim}»</div>
      </div>
      <div class="qlabel">${STR.question}</div>
      <div class="verdicts" id="vd"></div>
      <div id="fbslot"></div>
    </div>
  </div>`);
  const vd=n.querySelector("#vd");
  ["A","B","C","D"].forEach(k=>{
    const L=LEVELS[k];
    const b=$(`<button class="vbtn" data-k="${k}" style="--vc:${L.color}">
      <span class="k">${k}</span><span class="lb">${L.label}</span>
      <span class="sub">${L.desc}</span></button>`);
    b.onclick=()=>answer(k,n);
    vd.appendChild(b);
  });
  n.querySelector("#quit").onclick=()=>{sfx.click();screenMenu();};
  setScreen(n);
  G_._node=n;
}

function answer(k,n){
  const g=G_; if(g.answeredThis) return; g.answeredThis=true;
  const c=g.deck[g.i];
  const ok=k===c.answer;
  g.answered++; stats.answered++;
  const btns=n.querySelectorAll(".vbtn");
  btns.forEach(b=>{b.disabled=true;
    const bk=b.dataset.k;
    if(bk===c.answer) b.classList.add("rightone");
    if(bk===k && !ok) b.classList.add("wrongone");
    if(bk===k) b.classList.add("pick");
  });
  let gained=0;
  if(ok){
    g.streak++; g.correct++; stats.correct++;
    const m=multiplier(g.streak); gained=Math.round(100*m);
    g.score+=gained; stats.xp+=gained;
    sfx.ok();
  }else{
    g.streak=0; g.lives--; sfx.bad();
    if(navigator.vibrate) try{navigator.vibrate(60);}catch{}
  }
  const L=LEVELS[c.answer];
  const fb=$(`<div class="fb">
    <div class="fbhead"><span class="fbdot" style="background:${ok?'var(--A)':'var(--D)'}"></span>
      ${ok?STR.correct:STR.wrong}
      ${ok?`<span class="fbpts" style="color:var(--A)">${STR.plus}${gained}${g.streak>=2?` · ${STR.streakBonus}${multiplier(g.streak)}`:''}</span>`:''}</div>
    <div class="fbverdict">${STR.correctAnswerWas}: <b style="color:${L.color}">${L.label}</b></div>
    <div class="fbwhy">${c.why}</div>
    <div class="fbsrc">${STR.sourceNote}</div>
    <button class="btn primary" style="margin-top:13px" id="nx">${g.i+1>=g.deck.length||g.lives<=0?'🏁 '+STR.finalScore:'▶️ '+STR.next}</button>
  </div>`);
  fb.querySelector("#nx").onclick=()=>{sfx.click();advance();};
  n.querySelector("#fbslot").appendChild(fb);
  fb.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function advance(){
  const g=G_;
  g.i++; g.answeredThis=false;
  if(g.lives<=0 || g.i>=g.deck.length){ endRun(); return; }
  screenGame();
}

function endRun(){
  const g=G_;
  stats.games++;
  const isBest=g.score>stats.best;
  const prevRank=rankName();
  if(isBest) stats.best=g.score;
  const nowRank=rankName();
  const promoted=nowRank!==prevRank;
  save("vc_stats",stats);
  if(g.daily){daily={date:todaySeed(),done:true,score:g.score,total:g.answered};save("vc_daily",daily);}
  sfx.win();
  const acc=g.answered?Math.round(g.correct/g.answered*100):0;
  const n=$(`<div class="screen on"><div class="scroll">
    <div class="center" style="margin-top:4vh">
      ${EMBLEM("big-emb")}
      <h2>${STR.gameOver}</h2>
      <div class="muted" style="margin:6px 0 12px">${g.daily?STR.dailyTitle:''}</div>
      <div class="result-score">${g.score}</div>
      ${isBest?`<div style="color:var(--A);font-weight:700;margin-top:6px">✨ ${STR.newBest}</div>`:''}
      ${promoted?`<div style="color:var(--cyan);font-weight:700;margin-top:4px">⬆️ ${STR.rankUp} ${nowRank}</div>`:''}
    </div>
    <div class="statbar">
      <div class="stat"><b>${g.correct}/${g.answered}</b><span>${STR.casesJudged}</span></div>
      <div class="stat"><b>${acc}%</b><span>${STR.accuracyLabel}</span></div>
      <div class="stat"><b>${nowRank}</b><span>${STR.rankLabel}</span></div>
    </div>
    <div class="foot">
      ${g.daily?'':`<button class="btn primary" id="again">🔄 ${STR.retry}</button>`}
      <button class="btn" id="menu">🏠 ${STR.toMenu}</button>
    </div>
    <button class="btn ghost sec" id="share">📣 ${STR.share}</button>
    <button class="btn ghost sm" id="sup" style="margin-top:10px">💜 ${STR.support}</button>
  </div></div>`);
  const ag=n.querySelector("#again"); if(ag) ag.onclick=()=>{sfx.click();g.daily?screenMenu():newRun();};
  n.querySelector("#menu").onclick=()=>{sfx.click();screenMenu();};
  n.querySelector("#sup").onclick=()=>{sfx.click();screenSupport();};
  n.querySelector("#share").onclick=()=>doShare(g.score,g.answered);
  setScreen(n);
}

async function doShare(score,total){
  sfx.click();
  const text=STR.shareText(score,total,rankName());
  const data={title:STR.title,text,url:SHARE_URL};
  try{
    if(navigator.share){await navigator.share(data);return;}
  }catch{return;}
  try{await navigator.clipboard.writeText(text+" "+SHARE_URL);toast(STR.shareCopied);}
  catch{toast(text);}
}

function screenHow(){
  const n=$(`<div class="screen on"><div class="scroll"></div></div>`);
  const s=n.querySelector(".scroll");
  s.appendChild(header(STR.howtoTitle));
  s.appendChild($(`<div class="card"><div class="ctitle">${STR.howtoTitle}</div>
    ${STR.howtoBody.map(p=>`<p class="lead">${p}</p>`).join("")}</div>`));
  s.appendChild($(`<div class="sec"><h3>${STR.legendTitle}</h3></div>`));
  const leg=$(`<div class="legend"></div>`);
  Object.values(LEVELS).forEach(L=>{
    leg.appendChild($(`<div class="leg"><span class="k" style="background:${L.color}">${L.key}</span>
      <div><b style="color:${L.color}">${L.label}</b><p>${L.desc}</p></div></div>`));
  });
  s.appendChild(leg);
  const b=$(`<button class="btn primary sec" id="go">🛰️ ${STR.play}</button>`);
  b.onclick=()=>{sfx.click();screenChapters();};
  s.appendChild(b);
  setScreen(n);
}

function screenSettings(){
  const n=$(`<div class="screen on"><div class="scroll"></div></div>`);
  const s=n.querySelector(".scroll");
  s.appendChild(header(STR.settings));
  const mk=(label,on,cb)=>{const r=$(`<div class="switch"><span>${label}</span><div class="tg ${on?'on':''}"></div></div>`);
    r.querySelector(".tg").onclick=()=>{const t=r.querySelector(".tg");const v=!t.classList.contains("on");
      t.classList.toggle("on",v);cb(v);};return r;};
  s.appendChild(mk(STR.soundOn,settings.sound,v=>{settings.sound=v;save("vc_set",settings);if(v)sfx.click();}));
  s.appendChild(mk(STR.bigText,settings.big,v=>{settings.big=v;save("vc_set",settings);applySettings();}));
  const rs=$(`<button class="btn ghost sec" id="rs">🗑️ ${STR.reset}</button>`);
  rs.onclick=()=>{if(confirm(STR.resetConfirm)){stats={...DEF_STATS};daily={date:0,done:false,score:0,total:0};
    save("vc_stats",stats);save("vc_daily",daily);toast("OK");screenMenu();}};
  s.appendChild(rs);
  s.appendChild($(`<div class="sec center muted" style="font-size:.78rem">${STR.sourceNote}</div>`));
  setScreen(n);
}

function screenSupport(){
  const n=$(`<div class="screen on"><div class="scroll"></div></div>`);
  const s=n.querySelector(".scroll");
  s.appendChild(header(STR.support));
  s.appendChild($(`<div class="card"><div class="ctitle">💜 ${STR.supportTitle}</div>
    <p class="lead">${STR.supportBody}</p></div>`));
  const don=$(`<button class="btn primary sec" id="don">${STR.supportDonate}</button>`);
  don.onclick=()=>{sfx.click();
    if(DONATE_URL){window.open(DONATE_URL,"_blank","noopener");}
    else{toast("Imposta DONATE_URL nel codice per attivare le donazioni.");}};
  s.appendChild(don);
  const sh=$(`<button class="btn" id="sh">${STR.supportShare}</button>`);
  sh.style.marginTop="10px";
  sh.onclick=()=>doShare(stats.best,stats.answered);
  s.appendChild(sh);
  s.appendChild($(`<div class="sec"><h3>${STR.packsTitle}</h3></div>`));
  const packs=["Grandi bufale","Missioni spaziali","Misteri archeologici"];
  packs.forEach(p=>s.appendChild($(`<div class="chip pack" style="flex-basis:100%">📦 <span style="color:var(--ink)">${p}</span><span class="lock">${STR.packLocked}</span></div>`)));
  s.appendChild($(`<div class="sec muted" style="font-size:.82rem">${STR.packsBody}</div>`));
  setScreen(n);
}

/* ───────── impostazioni globali ───────── */
function applySettings(){document.body.classList.toggle("big",!!settings.big);}

/* ───────── sfondo stellato animato (canvas, DPR cap, pausa su blur) ───────── */
const cv=document.getElementById("stars"),cx=cv.getContext("2d");
const DPR=Math.min(devicePixelRatio||1,1.5);
let stars=[],W=0,H=0,paused=false;
function resizeStars(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;
  cv.style.width=W+"px";cv.style.height=H+"px";cx.setTransform(DPR,0,0,DPR,0,0);
  const count=Math.min(140,Math.floor(W*H/9000));
  stars=Array.from({length:count},()=>({x:Math.random()*W,y:Math.random()*H,
    z:Math.random()*.8+.2,ph:Math.random()*6.28}));}
addEventListener("resize",resizeStars);addEventListener("orientationchange",resizeStars);resizeStars();
addEventListener("blur",()=>paused=true);addEventListener("focus",()=>{paused=false;last=performance.now();});
let last=performance.now();
function loop(now){requestAnimationFrame(loop);if(paused)return;
  const dt=Math.min(50,now-last);last=now;
  cx.clearRect(0,0,W,H);
  for(const s of stars){
    s.y+=s.z*0.012*dt; if(s.y>H){s.y=0;s.x=Math.random()*W;}
    s.ph+=0.002*dt;
    const tw=0.55+0.45*Math.sin(s.ph);
    const r=s.z*1.4;
    cx.globalAlpha=tw*(0.35+s.z*0.5);
    cx.fillStyle=s.z>0.75?"#bfe6ff":"#8fb0ff";
    cx.beginPath();cx.arc(s.x,s.y,r,0,6.283);cx.fill();
  }
  cx.globalAlpha=1;
}
requestAnimationFrame(loop);

/* ───────── tastiera: 1-4 = verdetti (physical key codes) ───────── */
const KEYMAP={Digit1:"A",Digit2:"B",Digit3:"C",Digit4:"D",Numpad1:"A",Numpad2:"B",Numpad3:"C",Numpad4:"D"};
addEventListener("keydown",e=>{const k=KEYMAP[e.code];if(!k)return;
  const n=G_&&G_._node;if(!n||!document.body.contains(n))return;
  const btn=n.querySelector(`.vbtn[data-k="${k}"]`);if(btn&&!btn.disabled){e.preventDefault();btn.click();}});

/* ───────── avvio ───────── */
screenMenu();
</script>
